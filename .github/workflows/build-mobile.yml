name: Build Mobile Apps

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install client dependencies
        run: npm install --legacy-peer-deps
        working-directory: client

      - name: Build web app
        run: npm run build
        working-directory: client

      - name: Install Capacitor CLI at root
        run: npm install @capacitor/cli @capacitor/core @capacitor/android --legacy-peer-deps --no-save

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
        working-directory: android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install client dependencies
        run: npm install --legacy-peer-deps
        working-directory: client

      - name: Build web app
        run: npm run build
        working-directory: client

      - name: Install Capacitor CLI at root
        run: npm install @capacitor/cli @capacitor/core @capacitor/ios --legacy-peer-deps --no-save

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Install CocoaPods
        run: pod install
        working-directory: ios/App

      - name: Build iOS (unsigned)
        run: |
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
        working-directory: ios/App

      - name: Package .app
        run: |
          mkdir -p Payload
          cp -r ios/App/build/Build/Products/Debug-iphoneos/App.app Payload/
          zip -r app-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: app-unsigned-ipa
          path: app-unsigned.ipa
